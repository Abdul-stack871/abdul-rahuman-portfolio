<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Abdul Rahuman</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      background-color: #0D0D0F;
      color: #F3F4F6;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }
    .glow-orange {
      position: fixed; top: -15%; left: -10%;
      width: 45vw; height: 45vw;
      border-radius: 9999px;
      background: rgba(255, 117, 71, 0.04);
      filter: blur(140px);
      pointer-events: none;
    }
    .glow-purple {
      position: fixed; bottom: -10%; right: -10%;
      width: 40vw; height: 40vw;
      border-radius: 9999px;
      background: rgba(155, 114, 242, 0.04);
      filter: blur(140px);
      pointer-events: none;
    }
    .card {
      position: relative; z-index: 10;
      background: #151518;
      border: 1px solid #232328;
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.6);
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #FF7547 0%, #9B72F2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .logo {
      display: inline-block;
      font-size: 1.25rem;
      font-weight: 800;
      color: white;
      text-decoration: none;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }
    .logo:hover { color: #FF7547; }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: #9CA3AF;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #FF7547;
      color: white;
      box-shadow: 0 4px 20px rgba(255, 117, 71, 0.3);
    }
    .btn-primary:hover {
      background: #ff855c;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 117, 71, 0.4);
    }
    .divider {
      height: 1px;
      background: #232328;
      margin: 1.5rem 0;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      font-size: 0.75rem;
      color: #9CA3AF;
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover { color: #FF7547; }
  </style>
</head>
<body>
  <div class="glow-orange"></div>
  <div class="glow-purple"></div>

  <div class="card">
    <a href="/" class="logo">AR</a>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="btn btn-primary">← Back to Portfolio</a>
    <div class="divider"></div>
    <div class="links">
      <a href="/#projects">Projects</a>
      <a href="/#experience">Experience</a>
      <a href="/#contact">Contact</a>
      <a href="https://github.com/Abdul-stack871" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</body>
</html>
